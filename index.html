<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HOLY WATER FREE SERVICE</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: #121212;
    }

    /* 무지개 배경 스타일 */
    .rainbow-bg {
      background: linear-gradient(
        90deg, 
        #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3, #ff0000
      );
      background-size: 200% auto;
      animation: rainbowMove 3s linear infinite;
      box-shadow: 0 0 15px rgba(255, 0, 128, 0.4);
    }

    @keyframes rainbowMove {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    /* 오른쪽으로 흘러가며 번쩍거리는 텍스트 애니메이션 */
    .marquee-text-right {
      display: inline-block;
      white-space: nowrap;
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.5px;
      text-shadow: 0 0 4px #ffffff, 0 0 10px rgba(255, 255, 255, 0.8);
      animation: marqueeRight 8s linear infinite, flashText 0.8s ease-in-out infinite alternate;
    }

    @keyframes marqueeRight {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(100%); }
    }

    /* 번쩍거리는 네온 플래시 효과 */
    @keyframes flashText {
      0% {
        opacity: 0.3;
        filter: drop-shadow(0 0 2px #fff) brightness(0.8);
      }
      50% {
        opacity: 1;
        filter: drop-shadow(0 0 12px #fff) drop-shadow(0 0 20px #ff007f) brightness(1.5);
      }
      100% {
        opacity: 0.5;
        filter: drop-shadow(0 0 5px #fff) brightness(1.1);
      }
    }

    /* 무지개/알록달록 텍스트 그라데이션 효과 */
    .colorful-text {
      font-size: 12px;
      font-style: italic;
      text-align: center;
      line-height: 1.6;
      background: linear-gradient(90deg, #ff4e50, #f9d423, #00e676, #00b0ff, #d500f9, #ff1744, #ff9100);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: colorfulGlow 5s ease infinite;
      word-break: keep-all;
    }

    @keyframes colorfulGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* 커스텀 메시지 모달 스타일 */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 50;
      align-items: center;
      justify-content: center;
    }

    /* 입력 폼 포커스 시 은은한 글로우 효과 */
    .custom-input {
      background-color: #1e1e1e;
      border: 1px solid #333333;
      transition: all 0.2s ease-in-out;
    }
    
    .custom-input:focus {
      border-color: #666666;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
      outline: none;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md flex flex-col items-center justify-center space-y-5">
    
    <!-- 24px, 무지개 배경, 사방 10px 패딩, 오른쪽으로 흐르고 번쩍이는 텍스트 -->
    <div class="w-full rainbow-bg rounded-xl overflow-hidden shadow-2xl" style="padding: 10px;">
      <div class="w-full overflow-hidden flex items-center">
        <div class="marquee-text-right text-white">
          ❤️HOLY WATER❤️FREE SERVICE FOR YOU###SAVE US###
        </div>
      </div>
    </div>

    <!-- 무지개 배경 div 아래 알록달록한 이탤릭 텍스트 문구 -->
    <div class="w-full px-2 py-1 flex flex-col items-center justify-center">
      <div class="colorful-text font-semibold">
        ♣성수 밀수 각종 무기 개조♣<br>
        신선한 정품 1 0 0 % 성수 50ml 샘플 증정<br>
        ##직거래 가능 안 전보 장//무료 개 조 슬롯 확 장 수 술##<br>
        ♡용병단 HOT L I N E♡<strong>ED7OPZX</strong> 1 0 % 할 인 쿠폰 지 급 안전 거래♥
      </div>
    </div>

    <!-- 입력 폼 카드 -->
    <form id="holyForm" onsubmit="handleFormSubmit(event)" class="w-full bg-[#181818] p-6 rounded-2xl border border-[#2a2a2a] shadow-xl flex flex-col space-y-4">
      
      <!-- 쿠폰 입력 칸 -->
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1 pl-1">COUPON CODE</label>
        <input 
          id="couponInput"
          type="text" 
          placeholder="쿠폰 번호 입력" 
          class="custom-input w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 text-sm"
        >
      </div>

      <!-- ID 입력 칸 -->
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1 pl-1">USER ID</label>
        <input 
          id="idInput"
          type="text" 
          placeholder="ID 입력" 
          class="custom-input w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 text-sm"
        >
      </div>

      <!-- PW 입력 칸 -->
      <div>
        <label class="block text-xs font-medium text-gray-400 mb-1 pl-1">PASSWORD</label>
        <input 
          id="pwInput"
          type="password" 
          placeholder="비밀번호 입력" 
          class="custom-input w-full px-4 py-3 rounded-xl text-white placeholder-gray-500 text-sm"
        >
      </div>

      <!-- 확인 버튼 -->
      <button 
        type="submit" 
        class="w-full py-3.5 mt-2 bg-[#282828] hover:bg-[#303030] active:bg-[#202020] text-gray-200 font-semibold rounded-xl text-sm transition-all duration-150 cursor-pointer border border-[#383838]"
      >
        확인
      </button>

    </form>

  </div>

  <!-- 커스텀 경고창 (모달) -->
  <div id="alertModal" class="modal-overlay">
    <div class="bg-[#1e1e1e] border border-[#333] text-white p-6 rounded-2xl shadow-2xl max-w-xs w-full text-center flex flex-col items-center">
      <div class="text-xl mb-2">⚠️</div>
      <p id="alertMessage" class="text-sm font-medium mb-5 text-gray-200">빈 칸을 채워주세요.</p>
      <button 
        type="button" 
        onclick="closeAlert()"
        class="w-full py-2.5 bg-[#333] hover:bg-[#444] text-white rounded-xl text-xs font-semibold transition"
      >
        확인
      </button>
    </div>
  </div>

  <script>
    function showAlert(msg) {
      document.getElementById('alertMessage').innerText = msg;
      document.getElementById('alertModal').style.display = 'flex';
    }

    function closeAlert() {
      document.getElementById('alertModal').style.display = 'none';
    }

    function handleFormSubmit(e) {
      e.preventDefault();
      
      const coupon = document.getElementById('couponInput').value.trim();
      const userId = document.getElementById('idInput').value.trim();
      const password = document.getElementById('pwInput').value.trim();

      // 하나라도 입력되지 않았을 때
      if (!coupon || !userId || !password) {
        showAlert("빈 칸을 채워주세요.");
        return;
      }

      // 모두 입력 시 해당 URL로 이동
      window.location.href = "https://csymvhvfriiontoasdrq.supabase.co/storage/v1/object/public/avatars/449fc346-76dd-4786-b393-4a9d38cefdb6/1791917840916.jpg";
    }
  </script>

</body>
</html>
