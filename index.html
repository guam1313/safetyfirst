<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Page</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #202020;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }
    .main-container {
      margin: auto 0;
      width: 100%;
      max-width: 360px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    input {
      width: 100%;
      padding: 14px;
      background-color: #2c2c2c;
      border: 1px solid #404040;
      border-radius: 6px;
      color: #ffffff;
      font-size: 14px;
      outline: none;
    }
    input::placeholder {
      color: #888888;
    }
    input:focus {
      border-color: #666666;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: #3a3a3a;
      border: none;
      border-radius: 6px;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }
    footer {
      padding-bottom: 20px;
      font-size: 14px;
      letter-spacing: 1px;
      text-align: center;
      color: #ff4d4d;
    }
  </style>
</head>
<body>

  <div class="main-container">
    <input type="text" placeholder="쿠폰 번호 입력">
    <input type="text" placeholder="ID 입력">
    <input type="password" placeholder="PW 입력">
    <!-- 버튼 클릭 시 아무 동작도 하지 않음 -->
    <button type="button">확인</button>
  </div>

  <footer>
    ❤️HOLY WATER❤️FREE SERVICE FOR YOU❤️
  </footer>

</body>
</html>
